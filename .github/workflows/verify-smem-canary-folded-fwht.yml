# SPDX-License-Identifier: Apache-2.0
name: Verify CTA-SMEM Canary & Folded FWHT Receipts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-smem-canary-folded-fwht:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pure-stdlib 3-mode isolated -I receipt & tamper-refusal verification
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for flags in "-I -B" "-I -O -B" "-I -B -W error"; do
            python3 $flags verify/verify_smem_canary_folded_fwht.py --check --require-verdict CONFIRMED --json
            python3 $flags verify/test_smem_canary_folded_fwht_r5.py
          done

      - name: Fail-closed hygiene, leak, telemetry, bare-assert, & internal-tag check
        run: |
          set -eu
          ALL_FILES=(
            cuda/sm86/holosphere_smem_canary_folded_fwht_sm86.cu
            cuda/sm86/holosphere_smem_canary_folded_fwht_bench.cu
            cuda/sm86/holosphere_smem_canary_folded_fwht.mk
            cuda/sm86/README_SMEM_CANARY_FOLDED_FWHT.md
            receipts/smem_canary_folded_fwht_ptxas_receipt.json
            receipts/smem_canary_folded_fwht_results.json
            verify/verify_smem_canary_folded_fwht.py
            verify/test_smem_canary_folded_fwht_r5.py
          )
          NON_GUARD_FILES=(
            cuda/sm86/holosphere_smem_canary_folded_fwht_sm86.cu
            cuda/sm86/holosphere_smem_canary_folded_fwht_bench.cu
            cuda/sm86/holosphere_smem_canary_folded_fwht.mk
            cuda/sm86/README_SMEM_CANARY_FOLDED_FWHT.md
            receipts/smem_canary_folded_fwht_ptxas_receipt.json
            receipts/smem_canary_folded_fwht_results.json
          )
          for f in "${ALL_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected file missing: $f" >&2
              exit 1
            fi
          done

          rc=0
          grep -rnEi '[/]home/|[/]Users/|hf_[A-Za-z0-9]{20}|ghp_[A-Za-z0-9]{20}|gho_[A-Za-z0-9]{20}|sk-[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|\b(Track[[:space:]]+S[0-9]+|EXP-Q[0-9]+|CS-[0-9]+|AUDIT-[A-Z0-9-]+|H19[a-d]?|PREREG-[A-Z0-9-]+|W1[0-9]-OBS)\b' "${ALL_FILES[@]}" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "ERROR: leak, internal tag, or grep error detected (rc=$rc)" >&2
            exit 1
          fi

          rc=0
          grep -rnEi '(RAPL|NVML|nvidia-smi|\b(mJ|uJ|J)[[:space:]]*/[[:space:]]*tok|\btok(en)?s?[[:space:]]*/[[:space:]]*(m|u|k)?J\b|\b(watts?|joules?|kWh|MWh|TDP|mAh)\b)' "${NON_GUARD_FILES[@]}" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "ERROR: forbidden power/energy telemetry claim or grep error detected (rc=$rc)" >&2
            exit 1
          fi

          python3 -I -B -c '
          import ast, pathlib, sys
          for p in ("verify/verify_smem_canary_folded_fwht.py", "verify/test_smem_canary_folded_fwht_r5.py"):
              for n in ast.walk(ast.parse(pathlib.Path(p).read_text(encoding="utf-8"))):
                  if isinstance(n, ast.Assert):
                      sys.exit(f"ERROR: bare assert in {p}:{n.lineno}")
          print("SMEM_CANARY_HYGIENE_PASS=1")
          '
